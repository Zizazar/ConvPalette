name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты и проверки
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов (svelte-check)
        run: npm run check

      - name: Форматирование Rust
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Тесты Rust
        working-directory: src-tauri
        run: cargo test --all-features

  build:
    name: Сборка установщика
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка Tauri (+ релиз по тегу)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Непустой tagName => action создаёт черновик релиза и заливает установщик.
          # На обычных push/PR он пустой — идёт только сборка.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ConvPalette ${{ github.ref_name }}
          releaseBody: |
            Установщик NSIS (per-user) для Windows x64.
            Полный список изменений — в истории коммитов.
          releaseDraft: true
          prerelease: false

      - name: Артефакт установщика
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: convpalette-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
